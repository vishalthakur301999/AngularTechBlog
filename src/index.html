<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Etch — CPUs, GPUs and AI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Concise tech writing about processors, graphics cards, and the major AI developments of the last five years."
    />
    <meta name="theme-color" content="#06070a" />
    <!-- SVG for browsers that take it, .ico (16/32/48) as the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/FjallaOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('etch-theme');
        document.documentElement.dataset.theme =
          stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
