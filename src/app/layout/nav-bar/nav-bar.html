<a class="skip-link" href="#main">Skip to content</a>

<nav class="nav" [class.nav--open]="menuOpen()" [class.nav--overlay]="overlay()">
  <a class="nav__brand" routerLink="/" aria-label="Etch, home">
    <app-logo class="nav__mark" />
    <span class="nav__wordmark">Etch</span>
  </a>

  <button
    class="nav__toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="nav-links"
    (click)="toggleMenu()"
  >
    {{ menuOpen() ? 'Close' : 'Menu' }}
  </button>

  <div class="nav__links" id="nav-links">
    @for (category of categories; track category.id) {
      <a
        class="nav__link"
        [routerLink]="['/', category.id]"
        routerLinkActive="nav__link--active"
        [title]="category.tagline"
      >
        {{ category.label }}
      </a>
    }

    <button
      class="nav__theme"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="
        theme.current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
    >
      {{ theme.current() === 'dark' ? '☀' : '☾' }}
    </button>
  </div>
</nav>
